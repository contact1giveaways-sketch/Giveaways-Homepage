<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening… · Giveaways Community</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#1d1a16;--muted:#7a7266;--gold:#c9962d;--line:#e7e0d5}
  @media (prefers-color-scheme: dark){:root{--bg:#141210;--card:#1d1a17;--ink:#f3eee6;--muted:#a59c8f;--line:#2e2a25}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
  img{width:56px;height:56px;border-radius:14px}
  h1{font-size:19px;margin:14px 0 6px}
  p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.45;word-break:break-word}
  a.btn{display:block;padding:14px;border-radius:12px;background:var(--gold);color:#fff;font-weight:700;text-decoration:none;margin-bottom:10px}
  a.back{display:block;padding:12px;color:var(--muted);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <img src="/icon-192.png" alt="">
  <h1 id="t">Opening…</h1>
  <p id="h"></p>
  <a class="btn" id="go" href="/">Continue</a>
  <a class="back" href="/">← Back to Giveaways</a>
</div>
<script>
(function(){
  // Doar site-urile noastre de încredere se deschid automat.
  var SAFE = /^https:\/\/([a-z0-9-]+\.)*(raffall\.com|giveawayscommunity\.com|t\.me|telegram\.me|wa\.me|whatsapp\.com)(\/|$)/i;
  var to = new URLSearchParams(location.search).get('to') || '';
  if (!/^https:\/\//i.test(to)) { location.replace('/'); return; }
  var host = '';
  try { host = new URL(to).hostname.replace(/^www\./, ''); } catch (e) { location.replace('/'); return; }
  var name = /raffall\.com$/i.test(host) ? 'Raffall' : host;
  document.getElementById('t').textContent = 'Opening ' + name + '…';
  document.getElementById('h').textContent = 'If nothing happens, tap the button below.';
  var go = document.getElementById('go');
  go.href = to;
  go.textContent = 'Open ' + name;
  if (SAFE.test(to)) location.href = to;
  else document.getElementById('t').textContent = 'You are leaving Giveaways';
})();
</script>
</body>
</html>
